name: HowHub CI
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite, fileinfo, curl, openssl
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Browser script syntax
        run: node --check public/assets/site.js
      - name: Diagnostics unit tests
        run: php tests/diagnostics.php
      - name: Streaming parser tests
        run: php tests/stream.php
      - name: Smoke tests
        run: php tests/smoke.php
      - name: Universal HTML import tests
        run: php tests/universal_import.php
      - name: URL and video import tests
        run: php tests/url_import.php
      - name: Compliant discovery agent tests
        run: php tests/agent.php
      - name: Autonomous source research, provenance and rich format tests
        run: php tests/agent_research.php
      - name: Topic-only original content and multimodal workflow tests
        run: php tests/agent_topic.php
      - name: Second-pass quality and original AV tests
        run: php tests/agent_quality_av.php
      - name: Expanded diagram and MathML tests
        run: php tests/agent_rich_diagrams.php
      - name: Claim to indexed evidence safety tests
        run: php tests/agent_claim_checks.php
      - name: Agent runtime prerequisite diagnostics
        run: php tests/agent_runtime.php && php bin/agent-check.php > /tmp/howhub-agent-check.json
      - name: Async original video provider adapter tests
        run: php tests/agent_ai_video.php
      - name: Approved original source document fact checks
        run: php tests/agent_fact_documents.php
      - name: HTTP and admin end-to-end checks
        run: bash tests/e2e.sh
      - name: Verified update and rollback integration test
        run: sudo env HOWHUB_PHP="$(command -v php)" HOWHUB_WEB_USER=www-data bash tests/update.sh
