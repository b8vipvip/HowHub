name: HowHub CI
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite, fileinfo, curl, openssl
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Diagnostics unit tests
        run: php tests/diagnostics.php
      - name: Smoke tests
        run: php tests/smoke.php
      - name: HTTP and admin end-to-end checks
        run: bash tests/e2e.sh
